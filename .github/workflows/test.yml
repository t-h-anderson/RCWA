name: MATLAB tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up MATLAB
        # Batch licensing for matlab-actions is granted automatically on
        # PUBLIC repos. If this repo ever goes private, add a
        # MathWorks-issued batch token and pass it here as:
        #     with:
        #       license: ${{ secrets.MLM_LICENSE_TOKEN }}
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Run unit tests
        uses: matlab-actions/run-tests@v2
        with:
          # Folders prepended to the MATLAB path. Listed explicitly
          # rather than using genpath because the action does not
          # recurse. Keep this in sync with RCWA/oop/tests/run_all.m.
          source-folder: |
            RCWA
            RCWA/Materials
            RCWA/Materials/aSiH
            RCWA/oop
          select-by-folder: RCWA/oop/tests
          test-results-junit: test-results/junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/junit.xml
